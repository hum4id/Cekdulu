[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cekdulu"
version = "1.0.0"
description = "CekDulu: sistem triase penipuan keuangan multimodal (teks, gambar/QRIS, golden hour) untuk pengguna Indonesia."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dyz" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "opencv-python-headless>=4.9",
  "pillow>=10.2",
  "reportlab>=4.1",
  "sqlalchemy>=2.0",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
transformers = ["torch>=2.2", "transformers>=4.40", "datasets>=2.18", "accelerate>=0.28"]
train = ["matplotlib>=3.8", "pyyaml>=6.0"]
demo = ["gradio>=4.20"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "qrcode[pil]>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "E501",   # panjang baris diurus ruff format; sisa berupa string teks Bahasa Indonesia
  "S101",   # assert dipakai di test
  "RUF001", "RUF002", "RUF003",  # teks Bahasa Indonesia berisi karakter ambigu (mis. tanda kutip)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"scripts/**" = ["S311", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: test yang memuat model terlatih atau dependensi berat",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["cekdulu"]
omit = ["src/cekdulu/ml/transformers_backend.py", "src/cekdulu/bot/*"]
